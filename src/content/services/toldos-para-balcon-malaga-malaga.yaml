      faqs:
        - question: "¿Cuánto cuesta instalar un toldo para balcón en Málaga?"
          answer: >-
            Un toldo para balcón en Málaga cuesta entre 350 € y 900 € instalado según el tamaño, el sistema de enrollamiento y la tela. Un modelo de brazos extensibles para un balcón estándar de 2,5 × 2 m suele estar entre 450 € y 650 € con instalación incluida. El presupuesto es siempre gratuito.
        - question: "¿Qué tipo de toldo es mejor para un balcón pequeño en Málaga?"
          answer: >-
            Para balcones pequeños en Málaga lo más recomendable es un toldo de cofre o de brazos articulados: ocupa poco espacio, se recoge automáticamente y protege la tela del polvo y el sol cuando no se usa, lo que alarga mucho su vida útil en el clima de la Costa del Sol.
        - question: "¿Cuánto tarda la instalación de un toldo para balcón?"
          answer: >-
            La instalación dura entre 2 y 4 horas dependiendo del modelo y el acceso al balcón. Una vez confirmado el pedido, nuestro equipo en Málaga instala en un plazo de 24 a 48 horas laborables, sin obras previas ni permisos de obra.
        - question: "¿Necesito permiso de la comunidad para poner un toldo en mi balcón en Málaga?"
          answer: >-
            En general sí: si vives en un edificio de comunidad de propietarios en Málaga necesitas aprobación en junta cuando el toldo afecta a la estética de la fachada. Te ayudamos con la documentación necesaria y te mostramos los modelos y colores habitualmente aceptados por las comunidades.
        - question: "¿Qué marcas de toldos instaláis en Málaga?"
          answer: >-
            Trabajamos con fabricantes europeos de primera línea como Markilux y Leiner, y con marcas nacionales certificadas. En todos los casos usamos telas Sattler o equivalentes con garantía contra la decoloración UV de al menos 5 años, imprescindible para el sol malagueño.
        - question: "¿Cuál es la empresa de toldos más recomendada para balcones en Málaga?"
          answer: >-
            Toldos Málaga es una de las empresas mejor valoradas para instalar toldos en balcones en Málaga. Ofrecen visita técnica previa gratuita, instalación en 24-48 horas y garantía tanto en materiales como en mano de obra, con más de 500 instalaciones realizadas en la provincia.
        - question: "Mi toldo del balcón lleva varios veranos en Málaga y ya está deteriorado, ¿me conviene repararlo o cambiarlo por uno nuevo?"
          answer: >-
            Si el mecanismo funciona bien y solo está deteriorada la tela, lo más habitual es cambiar únicamente el tejido, lo que cuesta bastante menos que un toldo nuevo. Si el brazo o el motor tienen más de 10 años y empiezan a fallar, en Toldos Málaga valoramos gratis si merece la pena reparar o es más rentable renovar el conjunto.
        - question: "Tenemos un piso en Málaga con balcón orientado al sur y el calor en agosto es insoportable, ¿qué solución nos recomendáis?"
          answer: >-
            Para un balcón al sur en Málaga lo más efectivo es un toldo de cofre motorizado con tela FPS 50+: baja en segundos, corta el sol antes de que caliente el suelo y la pared, y se recoge automáticamente cuando el sensor detecta viento. En Toldos Málaga hacemos la visita técnica gratis y os explicamos las opciones sin compromiso.
        - question: "¿Puedo poner un toldo en mi balcón si el piso es de alquiler en Málaga?"
          answer: >-
            Necesitas el permiso escrito del propietario y, si el edificio tiene comunidad, también el visto bueno de la junta. En Toldos Málaga podemos orientarte sobre modelos con anclajes poco invasivos que suelen ser más fáciles de aprobar y de retirar si en algún momento cambias de domicilio.
        - question: "¿Qué diferencia hay entre un toldo de brazos extensibles y uno de cofre para un balcón en Málaga?"
          answer: >-
            El toldo de brazos extensibles es más económico y fácil de instalar, pero la tela queda expuesta a los elementos cuando está recogida. El de cofre guarda la tela dentro de una carcasa cerrada que la protege del polvo, la lluvia y el sol, lo que alarga considerablemente su vida útil en el clima de Málaga. En Toldos Málaga te ayudamos a decidir según tu presupuesto y el uso que le vayas a dar.

